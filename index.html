<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SYSTEM HUD - SOLO LEVELING</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@500;600;700&display=swap');
        
        body { 
            font-family: 'Rajdhani', sans-serif; 
            background-color: #030712; 
            color: #f3f4f6; 
            overflow-x: hidden; 
            user-select: none;
        }
        
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        
        /* Sci-fi Glows & Animations */
        .glow-cyan { box-shadow: 0 0 20px rgba(6, 182, 212, 0.35); }
        .glow-blue { box-shadow: 0 0 25px rgba(59, 130, 246, 0.4); }
        .glow-red { box-shadow: 0 0 25px rgba(239, 68, 68, 0.6); }
        .text-glow-cyan { text-shadow: 0 0 10px rgba(6, 182, 212, 0.7); }
        .text-glow-red { text-shadow: 0 0 10px rgba(239, 68, 68, 0.8); }

        /* Custom Sci-fi Panels */
        .system-card {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.9) 0%, rgba(3, 7, 18, 0.95) 100%);
            border: 1px solid rgba(6, 182, 212, 0.3);
            position: relative;
            clip-path: polygon(
                0 10px, 10px 0, 
                calc(100% - 10px) 0, 100% 10px, 
                100% calc(100% - 10px), calc(100% - 10px) 100%, 
                10px 100%, 0 calc(100% - 10px)
            );
        }

        .system-card-gold {
            background: linear-gradient(135deg, rgba(30, 25, 10, 0.9) 0%, rgba(3, 7, 18, 0.95) 100%);
            border: 1px solid rgba(234, 179, 8, 0.4);
            clip-path: polygon(0 10px, 10px 0, calc(100% - 10px) 0, 100% 10px, 100% calc(100% - 10px), calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px));
        }

        .system-card-red {
            background: linear-gradient(135deg, rgba(30, 10, 10, 0.9) 0%, rgba(3, 7, 18, 0.95) 100%);
            border: 1px solid rgba(239, 68, 68, 0.4);
            clip-path: polygon(0 10px, 10px 0, calc(100% - 10px) 0, 100% 10px, 100% calc(100% - 10px), calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px));
        }

        /* Pulse Animations */
        @keyframes pulse-cyan {
            0%, 100% { border-color: rgba(6, 182, 212, 0.3); box-shadow: 0 0 10px rgba(6, 182, 212, 0.2); }
            50% { border-color: rgba(6, 182, 212, 0.8); box-shadow: 0 0 22px rgba(6, 182, 212, 0.6); }
        }
        .animate-pulse-cyan { animation: pulse-cyan 3s infinite ease-in-out; }

        /* Ornate Dialogue Box Styling */
        .dialogue-box {
            background: linear-gradient(180deg, rgba(14, 165, 233, 0.25) 0%, rgba(3, 105, 161, 0.45) 100%);
            border: 2px solid #0ea5e9;
            box-shadow: 0 0 30px rgba(14, 165, 233, 0.5), inset 0 0 15px rgba(14, 165, 233, 0.3);
            position: relative;
        }
        
        .dialogue-corner {
            position: absolute;
            width: 12px;
            height: 12px;
            border-color: #38bdf8;
        }
        .top-l { top: 4px; left: 4px; border-top: 2px solid; border-left: 2px solid; }
        .top-r { top: 4px; right: 4px; border-top: 2px solid; border-right: 2px solid; }
        .bot-l { bottom: 4px; left: 4px; border-bottom: 2px solid; border-left: 2px solid; }
        .bot-r { bottom: 4px; right: 4px; border-bottom: 2px solid; border-right: 2px solid; }

        /* Radar Chart Polygon Styling */
        .radar-grid { stroke: rgba(6, 182, 212, 0.2); stroke-width: 1; fill: none; }
        .radar-poly { fill: rgba(147, 51, 234, 0.35); stroke: #a855f7; stroke-width: 2.5; filter: drop-shadow(0px 0px 8px rgba(168, 85, 247, 0.7)); }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            // Leveling & Stats State
            const [level, setLevel] = useState(9);
            const [xp, setXp] = useState(1143);
            const [todayXp, setTodayXp] = useState(50);
            const [gold, setGold] = useState(85);
            const [streak, setStreak] = useState(87);
            const [activeTab, setActiveTab] = useState("overview");
            const [rankIndex, setRankIndex] = useState(0); // 0: E, 1: D, 2: C, 3: B, 4: A, 5: S
            const [shiftActive, setShiftActive] = useState(false);

            // Hunter Ranks Config
            const ranks = [
                { name: "E-Rank", minLvl: 1, maxLvl: 9, mult: "x1.0", nextXp: 1500, color: "text-gray-300", border: "border-gray-500" },
                { name: "D-Rank", minLvl: 10, maxLvl: 24, mult: "x1.5", nextXp: 3500, color: "text-green-400", border: "border-green-500" },
                { name: "C-Rank", minLvl: 25, maxLvl: 49, mult: "x2.0", nextXp: 8000, color: "text-blue-400", border: "border-blue-500" },
                { name: "B-Rank", minLvl: 50, maxLvl: 99, mult: "x3.0", nextXp: 18000, color: "text-purple-400", border: "border-purple-500" },
                { name: "A-Rank", minLvl: 100, maxLvl: 199, mult: "x4.5", nextXp: 40000, color: "text-amber-400", border: "border-amber-500" },
                { name: "S-Rank", minLvl: 200, maxLvl: 999, mult: "x6.0", nextXp: 100000, color: "text-red-500", border: "border-red-600" }
            ];

            const currentRank = ranks[rankIndex];

            // Attributes & Stats
            const [stats, setStats] = useState({ str: 14, agi: 12, int: 16, vit: 13, dis: 15 });
            const [statPoints, setStatPoints] = useState(3);

            // Dialogue Box State
            const [activeAlarm, setActiveAlarm] = useState({
                visible: true,
                title: "ALARM",
                message: "THE SYSTEM WILL HELP THE 'PLAYER'S GROWTH.",
                highlight: "PLAYER",
                type: "cyan"
            });

            // Stopwatches State (Economics & Sociology)
            const [econTime, setEconTime] = useState(0);
            const [econRunning, setEconRunning] = useState(false);
            const [socTime, setSocTime] = useState(0);
            const [socRunning, setSocRunning] = useState(false);

            // Directives & Custom Quests
            const [dailyDirectives, setDailyDirectives] = useState([
                { id: 1, title: "Gym PPL Protocol + Decompression", category: "GYM", xp: 100, gold: 10, completed: false },
                { id: 2, title: "Economics Active Recall Session", category: "STUDY", xp: 120, gold: 15, completed: false },
                { id: 3, title: "Sociology Exam Paper Practice", category: "STUDY", xp: 120, gold: 15, completed: false },
                { id: 4, title: "Hit Daily Nutrition & Protein Goal", category: "NUTRITION", xp: 80, gold: 10, completed: false }
            ]);

            const [customQuests, setCustomQuests] = useState([
                { id: 101, title: "UCAS Personal Statement Draft 2", deadline: "2026-12-01T23:59", category: "UCAS", xp: 200, gold: 30, completed: false },
                { id: 102, title: "CTEC Business Unit 4 Portfolio", deadline: "2026-11-15T18:00", category: "WORK", xp: 150, gold: 20, completed: false }
            ]);

            const [newQuestTitle, setNewQuestTitle] = useState("");
            const [newQuestCategory, setNewQuestCategory] = useState("UCAS");
            const [newQuestDeadline, setNewQuestDeadline] = useState("");

            // Stopwatches logic
            useEffect(() => {
                let interval = null;
                if (econRunning) {
                    interval = setInterval(() => setEconTime(t => t + 1), 1000);
                } else {
                    clearInterval(interval);
                }
                return () => clearInterval(interval);
            }, [econRunning]);

            useEffect(() => {
                let interval = null;
                if (socRunning) {
                    interval = setInterval(() => setSocTime(t => t + 1), 1000);
                } else {
                    clearInterval(interval);
                }
                return () => clearInterval(interval);
            }, [socRunning]);

            const formatTime = (seconds) => {
                const hrs = Math.floor(seconds / 3600);
                const mins = Math.floor((seconds % 3600) / 60);
                const secs = seconds % 60;
                return `${hrs > 0 ? hrs + ':' : ''}${mins < 10 && hrs > 0 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
            };

            const triggerAlarm = (title, message, highlight, type = "cyan") => {
                setActiveAlarm({ visible: true, title, message, highlight, type });
            };

            const addXp = (amount, goldEarned) => {
                const newTotalXp = xp + amount;
                const newToday = todayXp + amount;
                const newGold = gold + goldEarned;
                setXp(newTotalXp);
                setTodayXp(newToday);
                setGold(newGold);

                if (newTotalXp >= currentRank.nextXp && rankIndex < ranks.length - 1) {
                    setRankIndex(r => r + 1);
                    setStatPoints(p => p + 5);
                    triggerAlarm("RANK UP", `CONGRATULATIONS. YOU HAVE ASCENDED TO ${ranks[rankIndex + 1].name}!`, ranks[rankIndex + 1].name, "cyan");
                } else {
                    triggerAlarm("ALARM", `[YOUR REWARDS HAVE ARRIVED. +${amount} XP / +${goldEarned} GOLD]`, "REWARDS", "cyan");
                }
            };

            const toggleDirective = (id) => {
                setDailyDirectives(dailyDirectives.map(d => {
                    if (d.id === id) {
                        const nextState = !d.completed;
                        if (nextState) addXp(d.xp, d.gold);
                        return { ...d, completed: nextState };
                    }
                    return d;
                }));
            };

            const toggleCustomQuest = (id) => {
                setCustomQuests(customQuests.map(q => {
                    if (q.id === id) {
                        const nextState = !q.completed;
                        if (nextState) addXp(q.xp, q.gold);
                        return { ...q, completed: nextState };
                    }
                    return q;
                }));
            };

            const addCustomQuest = (e) => {
                e.preventDefault();
                if (!newQuestTitle.trim() || !newQuestDeadline) return;
                const quest = {
                    id: Date.now(),
                    title: newQuestTitle,
                    category: newQuestCategory,
                    deadline: newQuestDeadline,
                    xp: 150,
                    gold: 25,
                    completed: false
                };
                setCustomQuests([...customQuests, quest]);
                setNewQuestTitle("");
                setNewQuestDeadline("");
                triggerAlarm("SYSTEM DIRECTIVE", "[NEW CUSTOM QUEST ASSIGNED TO YOUR COMMAND]", "QUEST ASSIGNED", "cyan");
            };

            // Calculate Completion Percentage for Brutal System Warning
            const completedCount = dailyDirectives.filter(d => d.completed).length;
            const completionRate = Math.round((completedCount / dailyDirectives.length) * 100);

            // Radar Chart Geometry (5 Axes: STR, AGI, INT, VIT, DIS)
            const getRadarCoordinates = (statsObj) => {
                const maxVal = 30;
                const keys = ['str', 'agi', 'int', 'vit', 'dis'];
                const angles = [-Math.PI / 2, -Math.PI / 10, Math.PI * 3 / 10, Math.PI * 7 / 10, Math.PI * 11 / 10];
                const points = keys.map((key, i) => {
                    const r = (Math.min(statsObj[key], maxVal) / maxVal) * 75;
                    const x = 100 + r * Math.cos(angles[i]);
                    const y = 100 + r * Math.sin(angles[i]);
                    return `${x},${y}`;
                });
                return points.join(' ');
            };

            return (
                <div className="max-w-md mx-auto min-h-screen pb-24 px-3 pt-4 bg-gray-950 text-gray-100 relative font-sans">
                    
                    {/* TOP BRANDING & TAB NAV */}
                    <header className="mb-4">
                        <div className="flex justify-between items-center mb-3">
                            <h1 className="font-orbitron font-black text-lg text-cyan-400 tracking-wider text-glow-cyan">SYSTEM HUD</h1>
                            <div className="flex items-center space-x-2">
                                <button onClick={() => setShiftActive(!shiftActive)} className={`px-2.5 py-1 text-[10px] font-orbitron font-bold rounded border transition ${shiftActive ? 'bg-green-950/80 border-green-500 text-green-300' : 'bg-gray-900 border-gray-700 text-gray-400'}`}>
                                    {shiftActive ? '🟢 SHIFT ACTIVE (£8/h)' : '⚪ SHIFT OFF'}
                                </button>
                                <span className="text-xs font-orbitron font-bold text-yellow-400 bg-yellow-950/40 border border-yellow-600/50 px-2 py-0.5 rounded">
                                    🪙 {gold}
                                </span>
                            </div>
                        </div>

                        {/* Top Tab Bar Navigation */}
                        <div className="grid grid-cols-4 gap-1 p-1 bg-gray-900/80 rounded-xl border border-cyan-900/40">
                            {["overview", "progress", "stats", "fitness"].map((tab) => (
                                <button 
                                    key={tab}
                                    onClick={() => setActiveTab(tab)}
                                    className={`py-2 text-[11px] font-orbitron font-bold uppercase rounded-lg transition-all ${activeTab === tab ? 'bg-cyan-600 text-white shadow-lg glow-cyan' : 'text-gray-400 hover:text-cyan-300'}`}
                                >
                                    {tab}
                                </button>
                            ))}
                        </div>
                    </header>

                    {/* ORNATE SYSTEM ALARM POPUP */}
                    {activeAlarm.visible && (
                        <div className="dialogue-box rounded-lg p-3.5 mb-4 animate-pulse-cyan">
                            <div className="top-l dialogue-corner"></div>
                            <div className="top-r dialogue-corner"></div>
                            <div className="bot-l dialogue-corner"></div>
                            <div className="bot-r dialogue-corner"></div>

                            <div className="flex justify-between items-center mb-1 border-b border-cyan-500/30 pb-1">
                                <div className="flex items-center space-x-1.5">
                                    <span className="text-cyan-300 font-bold">ⓘ</span>
                                    <span className="font-orbitron font-black text-xs text-cyan-200 tracking-widest">{activeAlarm.title}</span>
                                </div>
                                <button onClick={() => setActiveAlarm({ ...activeAlarm, visible: false })} className="text-xs text-cyan-400 hover:text-white font-bold">-[X]</button>
                            </div>
                            <p className="text-center font-orbitron text-xs text-cyan-100 py-1 tracking-wide font-semibold">
                                {activeAlarm.message.split(activeAlarm.highlight).map((part, i, arr) => (
                                    <React.Fragment key={i}>
                                        {part}
                                        {i < arr.length - 1 && (
                                            <span className={activeAlarm.type === 'red' ? 'text-red-500 font-bold text-glow-red' : 'text-green-400 font-bold text-glow-cyan'}>
                                                {activeAlarm.highlight}
                                            </span>
                                        )}
                                    </React.Fragment>
                                ))}
                            </p>
                        </div>
                    )}

                    {/* TAB 1: OVERVIEW */}
                    {activeTab === "overview" && (
                        <div className="space-y-4">
                            {/* Metric Cards Grid */}
                            <div className="grid grid-cols-2 gap-2.5">
                                <div className="system-card p-3 rounded-lg">
                                    <div className="flex justify-between items-center text-[10px] text-cyan-400 font-orbitron font-bold mb-1">
                                        <span>⚡ LEVEL</span>
                                        <span className="text-white text-sm font-black">{level}</span>
                                    </div>
                                    <div className="text-[10px] text-gray-400">Current Level</div>
                                </div>

                                <div className="system-card p-3 rounded-lg">
                                    <div className="flex justify-between items-center text-[10px] text-cyan-400 font-orbitron font-bold mb-1">
                                        <span>🏆 RANK</span>
                                        <span className={`text-sm font-black ${currentRank.color}`}>{currentRank.name}</span>
                                    </div>
                                    <div className="text-[10px] text-gray-400">Mult: {currentRank.mult}</div>
                                </div>

                                <div className="system-card p-3 rounded-lg">
                                    <div className="flex justify-between items-center text-[10px] text-cyan-400 font-orbitron font-bold mb-1">
                                        <span>✨ TODAY XP</span>
                                        <span className="text-cyan-300 text-sm font-black">+{todayXp}</span>
                                    </div>
                                    <div className="text-[10px] text-gray-400">Daily Gain</div>
                                </div>

                                <div className="system-card p-3 rounded-lg">
                                    <div className="flex justify-between items-center text-[10px] text-cyan-400 font-orbitron font-bold mb-1">
                                        <span>🎖️ TOTAL XP</span>
                                        <span className="text-white text-sm font-black">{xp}</span>
                                    </div>
                                    <div className="text-[10px] text-gray-400">Next: {currentRank.nextXp}</div>
                                </div>

                                <div className="system-card-gold p-3 rounded-lg">
                                    <div className="flex justify-between items-center text-[10px] text-yellow-400 font-orbitron font-bold mb-1">
                                        <span>🔥 STREAK</span>
                                        <span className="text-yellow-300 text-sm font-black">{streak} DAYS</span>
                                    </div>
                                    <div className="text-[10px] text-yellow-500/80">Best: {streak} Days</div>
                                </div>

                                <div className="system-card p-3 rounded-lg">
                                    <div className="flex justify-between items-center text-[10px] text-cyan-400 font-orbitron font-bold mb-1">
                                        <span>🎯 DIRECTIVES</span>
                                        <span className="text-white text-sm font-black">{completedCount} / {dailyDirectives.length}</span>
                                    </div>
                                    <div className="text-[10px] text-gray-400">{completionRate}% Completed</div>
                                </div>
                            </div>

                            {/* Weekly Activity Line Chart */}
                            <div className="system-card p-4 rounded-xl glow-cyan">
                                <div className="flex justify-between items-center mb-2">
                                    <span className="font-orbitron text-xs font-bold text-cyan-400">WEEKLY ACTIVITY</span>
                                    <span className="text-[10px] text-gray-400 font-orbitron">LAST 7 DAYS</span>
                                </div>
                                <div className="h-28 w-full relative flex items-end pt-4">
                                    <svg className="w-full h-full overflow-visible" viewBox="0 0 300 80">
                                        <path d="M 10 60 Q 50 10, 100 15 T 190 45 T 280 70" fill="none" stroke="url(#grad)" strokeWidth="3" />
                                        <defs>
                                            <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
                                                <stop offset="0%" stopColor="#06b6d4" />
                                                <stop offset="50%" stopColor="#3b82f6" />
                                                <stop offset="100%" stopColor="#22c55e" />
                                            </linearGradient>
                                        </defs>
                                    </svg>
                                </div>
                                <div className="flex justify-between text-[10px] text-gray-400 font-orbitron border-t border-gray-800 pt-1 mt-1">
                                    <span>F</span><span>S</span><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span>
                                </div>
                            </div>

                            {/* Consistency Neon Grid */}
                            <div className="system-card p-4 rounded-xl">
                                <span className="font-orbitron text-xs font-bold text-cyan-400 block mb-3">CONSISTENCY CYCLE</span>
                                <div className="flex justify-between items-center px-2">
                                    {['F', 'S', 'S', 'M', 'T', 'W', 'T'].map((day, idx) => (
                                        <div key={idx} className="flex flex-col items-center space-y-1.5">
                                            <div className={`w-6 h-6 rounded flex items-center justify-center border shadow ${idx < 6 ? 'bg-green-500 border-green-400 shadow-green-500/50' : 'border-gray-700 bg-gray-900'}`}>
                                                {idx < 6 && <span className="text-black text-xs font-bold">✓</span>}
                                            </div>
                                            <span className="text-[10px] font-orbitron text-gray-400">{day}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* TAB 2: PROGRESS & RANK SELECTOR */}
                    {activeTab === "progress" && (
                        <div className="space-y-4">
                            {/* Arisesolo Inspired Circular Tier Selector */}
                            <div className="system-card p-5 rounded-xl glow-cyan text-center relative overflow-hidden">
                                <div className="font-orbitron text-xs text-cyan-400 font-bold mb-4">HUNTER RANK CORE SYNC</div>
                                
                                {/* Hexagon Rank Ring Display */}
                                <div className="relative w-48 h-48 mx-auto flex items-center justify-center my-2">
                                    <svg className="absolute inset-0 w-full h-full transform -rotate-90">
                                        <circle cx="96" cy="96" r="80" stroke="rgba(6, 182, 212, 0.15)" strokeWidth="6" fill="none" />
                                        <circle cx="96" cy="96" r="80" stroke="#06b6d4" strokeWidth="6" fill="none" strokeDasharray="502" strokeDashoffset={502 - (502 * ((rankIndex + 1) / 6))} strokeLinecap="round" />
                                    </svg>

                                    {/* Central Selected Rank */}
                                    <div className="w-24 h-24 bg-gray-900/90 border-2 border-cyan-400 flex flex-col items-center justify-center rounded-xl shadow-lg shadow-cyan-500/30 z-10">
                                        <span className="font-orbitron font-black text-3xl text-cyan-300">{currentRank.name.charAt(0)}</span>
                                        <span className="text-[9px] font-orbitron text-gray-400 mt-0.5">{currentRank.name}</span>
                                    </div>
                                </div>

                                {/* Rank Selector Buttons */}
                                <div className="flex justify-center gap-1.5 mt-2">
                                    {ranks.map((r, i) => (
                                        <button 
                                            key={r.name}
                                            onClick={() => setRankIndex(i)}
                                            className={`w-8 h-8 rounded-lg font-orbitron font-bold text-xs border transition ${rankIndex === i ? 'bg-cyan-600 border-cyan-400 text-white shadow-md glow-cyan' : 'bg-gray-900 border-gray-800 text-gray-400'}`}
                                        >
                                            {r.name.charAt(0)}
                                        </button>
                                    ))}
                                </div>

                                <div className="mt-4 border-t border-gray-800 pt-3 text-left space-y-1 text-xs font-orbitron">
                                    <div className="flex justify-between text-gray-400">
                                        <span>SYNC STATUS:</span>
                                        <span className="text-cyan-400 font-bold">88% ESTABLISHED</span>
                                    </div>
                                    <div className="flex justify-between text-gray-400">
                                        <span>XP TO NEXT RANK:</span>
                                        <span className="text-yellow-400 font-bold">{currentRank.nextXp - xp} XP NEEDED</span>
                                    </div>
                                </div>
                            </div>

                            {/* CUSTOM SUBJECT STOPWATCHES (Economics & Sociology) */}
                            <div className="space-y-3">
                                <h3 className="font-orbitron font-bold text-xs text-cyan-400">SUBJECT REVISION STOPWATCHES</h3>
                                
                                {/* Economics Stopwatch */}
                                <div className="system-card p-4 rounded-xl flex items-center justify-between border-blue-500/40">
                                    <div>
                                        <div className="font-orbitron font-bold text-sm text-blue-400">ECONOMICS A-LEVEL</div>
                                        <div className="font-orbitron text-2xl font-black text-white my-1">{formatTime(econTime)}</div>
                                        <div className="text-[10px] text-gray-400">Active Recall / Past Papers</div>
                                    </div>
                                    <div className="flex flex-col gap-2">
                                        <button 
                                            onClick={() => setEconRunning(!econRunning)} 
                                            className={`px-4 py-2 rounded-lg font-orbitron text-xs font-bold ${econRunning ? 'bg-red-600 text-white' : 'bg-blue-600 text-white shadow-md'}`}
                                        >
                                            {econRunning ? 'STOP' : 'START'}
                                        </button>
                                        <button 
                                            onClick={() => { setEconRunning(false); if(econTime > 60) addXp(Math.floor(econTime/10), 10); setEconTime(0); }} 
                                            className="px-4 py-1 rounded bg-gray-800 text-gray-300 text-[10px] font-orbitron"
                                        >
                                            LOG SESSION
                                        </button>
                                    </div>
                                </div>

                                {/* Sociology Stopwatch */}
                                <div className="system-card p-4 rounded-xl flex items-center justify-between border-purple-500/40">
                                    <div>
                                        <div className="font-orbitron font-bold text-sm text-purple-400">SOCIOLOGY A-LEVEL</div>
                                        <div className="font-orbitron text-2xl font-black text-white my-1">{formatTime(socTime)}</div>
                                        <div className="text-[10px] text-gray-400">Essay Prep / Key Theories</div>
                                    </div>
                                    <div className="flex flex-col gap-2">
                                        <button 
                                            onClick={() => setSocRunning(!socRunning)} 
                                            className={`px-4 py-2 rounded-lg font-orbitron text-xs font-bold ${socRunning ? 'bg-red-600 text-white' : 'bg-purple-600 text-white shadow-md'}`}
                                        >
                                            {socRunning ? 'STOP' : 'START'}
                                        </button>
                                        <button 
                                            onClick={() => { setSocRunning(false); if(socTime > 60) addXp(Math.floor(socTime/10), 10); setSocTime(0); }} 
                                            className="px-4 py-1 rounded bg-gray-800 text-gray-300 text-[10px] font-orbitron"
                                        >
                                            LOG SESSION
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* TAB 3: STATS & RADAR CHART */}
                    {activeTab === "stats" && (
                        <div className="space-y-4">
                            {/* Attribute Radar Chart Display */}
                            <div className="system-card p-4 rounded-xl text-center glow-cyan">
                                <div className="font-orbitron text-xs text-purple-400 font-bold mb-2">HUNTER ATTRIBUTE MATRIX</div>
                                
                                <div className="w-52 h-52 mx-auto relative flex items-center justify-center my-2">
                                    <svg viewBox="0 0 200 200" className="w-full h-full">
                                        {/* Concentric Polygons */}
                                        {[0.25, 0.5, 0.75, 1].map((scale, idx) => (
                                            <polygon key={idx} points={getRadarCoordinates({ str: 30*scale, agi: 30*scale, int: 30*scale, vit: 30*scale, dis: 30*scale })} className="radar-grid" />
                                        ))}
                                        {/* Dynamic Stats Polygon */}
                                        <polygon points={getRadarCoordinates(stats)} className="radar-poly" />
                                    </svg>
                                </div>

                                <div className="flex justify-between text-[10px] font-orbitron text-purple-300 px-4 mt-1">
                                    <span>STR: {stats.str}</span>
                                    <span>AGI: {stats.agi}</span>
                                    <span>INT: {stats.int}</span>
                                    <span>VIT: {stats.vit}</span>
                                    <span>DIS: {stats.dis}</span>
                                </div>
                            </div>

                            {/* Stat Allocation Controls */}
                            <div className="system-card p-4 rounded-xl space-y-2">
                                <div className="flex justify-between items-center text-xs mb-2">
                                    <span className="font-orbitron font-bold text-gray-400">AVAILABLE STAT POINTS:</span>
                                    <span className="font-orbitron font-black text-yellow-400 text-base">{statPoints} PTS</span>
                                </div>

                                {Object.entries(stats).map(([key, val]) => (
                                    <div key={key} className="flex justify-between items-center bg-gray-900/80 p-2.5 rounded-lg border border-gray-800">
                                        <span className="uppercase text-xs font-orbitron font-bold text-cyan-400">{key}</span>
                                        <div className="flex items-center space-x-3">
                                            <span className="font-bold text-sm text-white">{val}</span>
                                            {statPoints > 0 && (
                                                <button 
                                                    onClick={() => { setStatPoints(p => p - 1); setStats({...stats, [key]: val + 1}); }}
                                                    className="bg-cyan-600 hover:bg-cyan-500 text-white w-6 h-6 rounded flex items-center justify-center font-bold text-xs"
                                                >
                                                    +
                                                </button>
                                            )}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* TAB 4: FITNESS & MAXIMUM POTENTIAL ENGINE */}
                    {activeTab === "fitness" && (
                        <div className="space-y-4">
                            {/* Physique & Potential Card */}
                            <div className="system-card p-4 rounded-xl glow-cyan">
                                <div className="font-orbitron text-xs font-bold text-cyan-400 mb-2">PHYSICAL MATRIX & POTENTIAL</div>
                                <div className="grid grid-cols-2 gap-2 text-xs font-orbitron mb-4">
                                    <div className="bg-gray-900/60 p-2 rounded border border-gray-800">HEIGHT: <span className="text-white font-bold">5'8.5"</span></div>
                                    <div className="bg-gray-900/60 p-2 rounded border border-gray-800">WEIGHT: <span className="text-white font-bold">58.5 KG</span></div>
                                    <div className="bg-gray-900/60 p-2 rounded border border-gray-800">SPLIT: <span className="text-cyan-400 font-bold">PPL + REHAB</span></div>
                                    <div className="bg-gray-900/60 p-2 rounded border border-gray-800">TARGET: <span className="text-green-400 font-bold">72.0 KG</span></div>
                                </div>

                                <div className="border-t border-gray-800 pt-3 space-y-2">
                                    <div className="flex justify-between text-xs font-orbitron">
                                        <span className="text-gray-400">MAXIMUM PHYSIQUE POTENTIAL GAP:</span>
                                        <span className="text-red-400 font-bold">13.5 KG REMAINING</span>
                                    </div>
                                    <div className="w-full bg-gray-900 h-2.5 rounded-full overflow-hidden border border-red-900/60">
                                        <div className="bg-gradient-to-r from-red-600 to-yellow-500 h-full" style={{ width: '42%' }}></div>
                                    </div>
                                </div>
                            </div>

                            {/* BRUTAL SYSTEM FEEDBACK ENGINE */}
                            <div className="system-card-red p-4 rounded-xl glow-red">
                                <div className="font-orbitron font-bold text-xs text-red-400 mb-1">⚠️ BRUTAL SYSTEM EVALUATION</div>
                                <p className="text-xs text-gray-300 leading-relaxed font-semibold">
                                    {completionRate < 50 
                                        ? "CRITICAL WARNING: You are acting weak and undisciplined. Missing your directives means you remain an E-Rank weakling. Double your effort or accept mediocrity."
                                        : "EXECUTION ACCEPTABLE: Keep pushing. The distance between your current state and your ceiling requires relentless daily discipline."}
                                </p>
                            </div>
                        </div>
                    )}

                    {/* DAILY DIRECTIVES & CUSTOM QUEST CREATOR (ALWAYS AVAILABLE AT BOTTOM) */}
                    <div className="mt-6 space-y-4">
                        <div className="flex justify-between items-center border-b border-gray-800 pb-2">
                            <h2 className="font-orbitron font-bold text-xs text-cyan-400">DAILY DIRECTIVES</h2>
                            <span className="text-[10px] text-red-400 font-orbitron animate-pulse">RESET: 23:59</span>
                        </div>

                        {/* Directives List */}
                        <div className="space-y-2">
                            {dailyDirectives.map(d => (
                                <div key={d.id} onClick={() => toggleDirective(d.id)} className={`p-3 rounded-xl border transition cursor-pointer flex items-center justify-between ${d.completed ? 'bg-gray-900/40 border-gray-800 opacity-50' : 'system-card hover:border-cyan-500'}`}>
                                    <div className="flex items-center space-x-3">
                                        <div className={`w-5 h-5 rounded flex items-center justify-center border font-bold text-xs ${d.completed ? 'bg-cyan-600 border-cyan-400 text-white' : 'border-gray-600 bg-gray-900 text-transparent'}`}>✓</div>
                                        <div>
                                            <p className={`text-xs font-bold ${d.completed ? 'line-through text-gray-500' : 'text-gray-200'}`}>{d.title}</p>
                                            <span className="text-[9px] text-cyan-400 font-orbitron">+{d.xp} XP / +{d.gold} GOLD</span>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>

                        {/* Custom Timed Quests */}
                        <div className="pt-2">
                            <h2 className="font-orbitron font-bold text-xs text-cyan-400 mb-2">CUSTOM TIMED QUESTS</h2>
                            
                            <form onSubmit={addCustomQuest} className="space-y-2 mb-3">
                                <input 
                                    type="text" 
                                    placeholder="Quest title (e.g., UCAS Statement Draft)..." 
                                    value={newQuestTitle}
                                    onChange={(e) => setNewQuestTitle(e.target.value)}
                                    className="w-full bg-gray-900 border border-gray-800 rounded-lg px-3 py-2 text-xs text-gray-200 focus:outline-none focus:border-cyan-500 font-sans"
                                />
                                <div className="flex gap-2">
                                    <input 
                                        type="datetime-local" 
                                        value={newQuestDeadline}
                                        onChange={(e) => setNewQuestDeadline(e.target.value)}
                                        className="flex-1 bg-gray-900 border border-gray-800 rounded-lg px-3 py-1.5 text-xs text-gray-400 focus:outline-none focus:border-cyan-500"
                                    />
                                    <button type="submit" className="bg-cyan-600 hover:bg-cyan-500 text-white font-orbitron font-bold text-xs px-4 rounded-lg shadow-md glow-cyan">
                                        ASSIGN
                                    </button>
                                </div>
                            </form>

                            <div className="space-y-2">
                                {customQuests.map(q => (
                                    <div key={q.id} onClick={() => toggleCustomQuest(q.id)} className={`p-3 rounded-xl border transition cursor-pointer flex items-center justify-between ${q.completed ? 'bg-gray-900/40 border-gray-800 opacity-50' : 'system-card border-yellow-500/40'}`}>
                                        <div className="flex items-center space-x-3">
                                            <div className={`w-5 h-5 rounded flex items-center justify-center border font-bold text-xs ${q.completed ? 'bg-yellow-600 border-yellow-400 text-white' : 'border-gray-600 bg-gray-900 text-transparent'}`}>✓</div>
                                            <div>
                                                <p className={`text-xs font-bold ${q.completed ? 'line-through text-gray-500' : 'text-gray-200'}`}>{q.title}</p>
                                                <span className="text-[9px] text-yellow-400 font-orbitron">DEADLINE: {q.deadline.replace('T', ' ')}</span>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>

                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
